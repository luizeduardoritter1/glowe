{% extends 'core/base.html' %}

{% block titulo %}Clientes — Glowe{% endblock %}

{% block conteudo %}
    <h2>Clientes</h2>
    <ul>
        {% for cliente in clientes %}
            <li><a href="{% url 'detalhe_cliente' cliente.id %}">{{ cliente.nome }}</a></li>
        {% empty %}
            <li>Nenhum cliente cadastrado ainda.</li>
        {% endfor %}
    </ul>
    <a href="{% url 'novo_cliente' %}">+ Novo cliente</a>
{% endblock %}
