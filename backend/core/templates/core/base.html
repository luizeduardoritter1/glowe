<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>{% block titulo %}Glowe{% endblock %}</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #faf7f8; color: #241b24; }
        header {
            background: #8e2a50;
            color: #fff;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 28px;
        }
        header h1 { margin: 0; font-size: 1.3rem; }
        nav a {
            color: #fff;
            text-decoration: none;
            opacity: 0.85;
            margin-right: 16px;
        }
        main { max-width: 800px; margin: 24px auto; padding: 0 24px; }
    </style>
</head>
<body>
    <header>
        <h1>💄 Glowe</h1>
        <nav>
            <a href="{% url 'lista_clientes' %}">Clientes</a>
            <a href="{% url 'lista_agendamentos' %}">Agendamentos</a>
            <a href="{% url 'lista_catalogo' %}">Catálogo</a>
            <a href="{% url 'lista_eventos' %}">Eventos</a>
        </nav>
    </header>
    <main>
        {% block conteudo %}{% endblock %}
    </main>
</body>
</html>
