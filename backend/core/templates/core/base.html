<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Glowe{% endblock %}</title>
    <style>
        :root {
            --app-bg: #f5f1f3; --sf: #ffffff; --sf2: #f7f2f5;
            --ink: #241b24; --ink2: #6b5f68; --ink3: #a093a0; --line: #ece2e9;
            --rose: #bc3c6a; --rose-ink: #8e2a50; --rose-soft: #f9e6ee; --rose-2: #e86a96;
            --green: #1f9e6a; --green-soft: #e4f3ec; --red: #d0604f; --amber: #be8a2a; --amber-soft: #f6ecd6; --blue: #3e6394;
            --wa: #25925a;
            --wa: #25925a;
            --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
            --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--app-bg); color: var(--ink); font-family: var(--sans); line-height: 1.55; -webkit-font-smoothing: antialiased; }
        a { color: var(--rose-ink); }
        .ic { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linejoin: round; stroke-linecap: round; flex: none; }

        /* ===== Layout: menu lateral + conteúdo ===== */
        .layout { display: grid; grid-template-columns: 224px 1fr; min-height: 100vh; }
        .side { background: var(--sf); border-right: 1px solid var(--line); padding: 20px 15px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; }
        .logo { display: flex; align-items: center; gap: 9px; font-family: var(--serif); font-weight: 600; font-size: 1.2rem; color: var(--ink); }
        .logo .mark { width: 22px; height: 22px; border-radius: 7px; background: radial-gradient(120% 120% at 30% 20%, var(--rose-2), var(--rose-ink)); box-shadow: 0 2px 8px -2px var(--rose); }
        .nav { display: flex; flex-direction: column; gap: 3px; }
        .nav a { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 10px; font-size: 13.5px; font-weight: 600; color: var(--ink2); text-decoration: none; }
        .nav a:hover { background: var(--sf2); }
        .nav a.on { background: var(--rose-soft); color: var(--rose-ink); }
        .nav a.on .ic { stroke: var(--rose); }
        .side-foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
        .side-foot b { font-size: 13px; display: block; color: var(--ink); }
        .side-foot small { font-size: 11px; color: var(--rose-ink); }
        .side-foot form { background: none; border: none; padding: 0; margin: 0; box-shadow: none; max-width: none; }
        .logout { background: none; border: none; box-shadow: none; color: var(--ink3); font-size: 11px; font-weight: 600; padding: 0; margin: 0; cursor: pointer; }
        .logout:hover { color: var(--rose-ink); filter: none; }
        .tbl form { display: inline; background: none; border: none; padding: 0; margin: 0; box-shadow: none; }
        .av { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(140deg, var(--rose), var(--rose-ink)); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; flex: none; }
        .av.sm { width: 26px; height: 26px; font-size: 11px; display: inline-grid; vertical-align: middle; margin-right: 8px; }
        .av.lg { width: 54px; height: 54px; font-size: 20px; }

        .content { min-width: 0; }
        main { max-width: 960px; margin: 0 auto; padding: 28px 32px; }

        /* ===== Cabeçalho de página (usar nas telas: .phead) ===== */
        .phead { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; margin-bottom: 22px; flex-wrap: wrap; }
        .phead h2 { margin: 0; }
        .phead .sub { margin: 3px 0 0; font-size: 13px; color: var(--ink3); }
        .phead-r { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

        h2 { font-family: var(--serif); color: var(--plum, var(--rose-ink)); font-size: 1.55rem; font-weight: 600; margin: 0 0 18px; }
        h3 { font-family: var(--serif); color: var(--ink); font-size: 1.15rem; margin: 22px 0 10px; }
        p { margin: 0 0 12px; }

        /* ===== Botões / ações ===== */
        .cta, main > a, main button, form button {
            display: inline-block; background: linear-gradient(140deg, var(--rose), var(--rose-ink)); color: #fff;
            border: none; border-radius: 10px; padding: 9px 16px; font-family: var(--sans); font-size: 13.5px;
            font-weight: 600; text-decoration: none; cursor: pointer; box-shadow: 0 8px 18px -8px var(--rose); margin: 0 6px 6px 0;
        }
        .cta:hover, main > a:hover, main button:hover, form button:hover { filter: brightness(0.96); }
        .cta.ghost { background: none; color: var(--rose-ink); border: 1px solid var(--rose); box-shadow: none; }
        .cta.wa { background: var(--wa); box-shadow: 0 8px 18px -8px var(--wa); }

        /* ===== Tabelas (usar nas listas: .tbl) ===== */
        .tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; background: var(--sf); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
        .tbl thead th { text-align: left; font-family: var(--mono); font-size: .64rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink3); padding: 11px 14px; border-bottom: 1px solid var(--line); }
        .tbl td { padding: 12px 14px; border-bottom: 1px solid var(--line); }
        .tbl tbody tr:last-child td { border-bottom: none; }
        .tbl tbody tr:hover { background: var(--sf2); }
        .ta-r { text-align: right; }

        /* ===== Painéis / cards ===== */
        .panel { background: var(--sf); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; margin-bottom: 16px; }
        .cols { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; }
        .panel h3:first-child { margin-top: 0; }
        .phead-cli { display: flex; gap: 14px; align-items: center; }
        .tbl.mini { border: none; }
        .tbl.mini td { padding: 9px 2px; }
        .tot { display: flex; justify-content: space-between; align-items: baseline; padding-top: 12px; margin-top: 6px; border-top: 2px solid var(--rose-soft); }
        .tot b { font-family: var(--serif); font-size: 1.35rem; color: var(--rose-ink); }
        .money { display: flex; justify-content: space-between; font-size: 13.5px; padding: 8px 0; border-bottom: 1px solid var(--line); }
        .money:last-child { border: none; }
        .money b { font-variant-numeric: tabular-nums; }
        .ev-row { display: flex; align-items: center; gap: 11px; padding: 10px 0; border-bottom: 1px solid var(--line); }
        .ev-row:last-child { border: none; }
        .ev-row .grow { flex: 1; }
        .ev-row b { font-size: 13.5px; }
        .ev-row small { display: block; color: var(--ink3); font-size: 11.5px; }
        .ev-dot { color: var(--rose); }
        /* Agenda — grade semanal */
        .wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; }
        .wk-col { background: var(--sf); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; min-height: 360px; }
        .wk-col.today { border-color: var(--rose); box-shadow: inset 0 0 0 1px var(--rose); }
        .wk-day { padding: 9px 0; text-align: center; font-size: 11px; color: var(--ink3); border-bottom: 1px solid var(--line); font-weight: 600; text-transform: capitalize; }
        .wk-day b { display: block; font-size: 15px; color: var(--ink); }
        .wk-col.today .wk-day b { color: var(--rose-ink); }
        .wk-body { padding: 6px; display: flex; flex-direction: column; gap: 6px; }
        .ev { display: block; background: var(--rose-soft); border-left: 3px solid var(--rose); border-radius: 8px; padding: 6px 8px; text-decoration: none; }
        .ev b { display: block; font-size: 11px; color: var(--ink); font-weight: 600; line-height: 1.3; }
        @media (max-width: 820px) { .wk { grid-template-columns: 1fr; } .wk-col { min-height: auto; } }
        /* Financeiro — KPIs */
        .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
        .kpi { background: var(--sf); border: 1px solid var(--line); border-radius: 13px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
        .kpi.accent { background: linear-gradient(160deg, var(--rose-soft), var(--sf) 90%); border-color: var(--rose); }
        .kpi .k-lbl { font-size: 11px; color: var(--ink3); }
        .kpi b { font-size: 1.4rem; font-variant-numeric: tabular-nums; color: var(--ink); }
        @media (max-width: 820px) { .kpis { grid-template-columns: 1fr; } }

        /* Chips e cores semânticas */
        .chip { font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 20px; background: var(--sf2); color: var(--ink2); border: 1px solid var(--line); white-space: nowrap; }
        .in { color: var(--green); } .out { color: var(--red); } .pend { color: var(--amber); }

        /* ===== Formulários (o {{ form.as_p }} gera <p><label></label> <input></p>) ===== */
        form { background: var(--sf); border: 1px solid var(--line); border-radius: 14px; padding: 22px; max-width: 620px; box-shadow: 0 4px 16px rgba(60, 20, 45, 0.05); }
        form p { display: flex; flex-direction: column; gap: 6px; margin: 0 0 15px; }
        form label { font-weight: 700; font-size: .8rem; color: var(--ink2); }
        form input, form select, form textarea { font-family: inherit; font-size: .95rem; width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); }
        form input:focus, form select:focus, form textarea:focus { outline: 2px solid var(--rose-soft); border-color: var(--rose); }
        form a { display: inline-block; margin-left: 10px; font-size: .9rem; color: var(--ink3); }

        /* ===== Fallback: listas simples (<ul><li>) enquanto as telas não viram tabela ===== */
        main ul { list-style: none; padding: 0; margin: 0 0 18px; display: flex; flex-direction: column; gap: 10px; }
        main li { background: var(--sf); border: 1px solid var(--line); border-radius: 12px; padding: 13px 16px; }
        main li a { font-weight: 600; text-decoration: none; }

        /* ===== Responsivo: menu vira barra no topo ===== */
        @media (max-width: 820px) {
            .layout { grid-template-columns: 1fr; }
            .side { position: static; height: auto; flex-direction: row; align-items: center; gap: 14px; overflow-x: auto; padding: 12px 16px; }
            .nav { flex-direction: row; }
            .side-foot { display: none; }
            main { padding: 20px; }
            .cols { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="side">
            <div class="logo"><span class="mark"></span> Glowe</div>
            <nav class="nav">
                <a href="{% url 'agenda' %}" class="{% if '/agenda' in request.path %}on{% endif %}"><svg class="ic"><use href="#ic-agenda"/></svg> Agenda</a>
                <a href="{% url 'lista_clientes' %}" class="{% if '/clientes' in request.path %}on{% endif %}"><svg class="ic"><use href="#ic-clientes"/></svg> Clientes</a>
                <a href="{% url 'lista_catalogo' %}" class="{% if '/catalogo' in request.path %}on{% endif %}"><svg class="ic"><use href="#ic-catalogo"/></svg> Catálogo</a>
                <a href="{% url 'lista_eventos' %}" class="{% if '/eventos' in request.path %}on{% endif %}"><svg class="ic"><use href="#ic-eventos"/></svg> Eventos</a>
                <a href="{% url 'financeiro' %}" class="{% if '/financeiro' in request.path %}on{% endif %}"><svg class="ic"><use href="#ic-financeiro"/></svg> Financeiro</a>
            </nav>
            <div class="side-foot">
                <span class="av">{{ user.username|first|upper }}</span>
                <div>
                    <b>{{ user.username }}</b>
                    <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit" class="logout">Sair</button></form>
                </div>
            </div>
        </aside>
        <div class="content">
            <main>
                {% block conteudo %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Sprite de ícones do menu -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
        <symbol id="ic-agenda" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></symbol>
        <symbol id="ic-clientes" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5.5 20a6.5 6.5 0 0113 0"/></symbol>
        <symbol id="ic-catalogo" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
        <symbol id="ic-eventos" viewBox="0 0 24 24"><path d="M12 3l2.2 4.6 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5L4.8 8.3l5-.7z"/></symbol>
        <symbol id="ic-financeiro" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18"/></symbol>
    </defs></svg>
</body>
</html>
