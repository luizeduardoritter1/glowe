{% extends 'core/base.html' %}
{% block titulo %}Excluir — Glowe{% endblock %}
{% block conteudo %}
    <h2>Excluir agendamento</h2>
    <p>Tem certeza que deseja excluir o agendamento de <strong>{{ agendamento.cliente.nome }}</strong> em {{ agendamento.data_hora|date:"d/m/Y H:i" }}?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Sim, excluir</button>
        <a href="{% url 'detalhe_agendamento' agendamento.id %}">Cancelar</a>
    </form>
{% endblock %}
