{% extends 'core/base.html' %}

{% block titulo %}Confirmar Exclusão — Glowe{% endblock %}

{% block conteudo %}
    <h2>Confirmar Exclusão</h2>
    <p>Tem certeza que deseja excluir <strong>{{ object }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Sim, excluir</button>
        <a href="{{ object.get_absolute_url }}">Cancelar</a>
    </form>
{% endblock %}
