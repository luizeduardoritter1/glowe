<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar — Glowe</title>
    <style>
        :root {
            --sf:#fff; --ink:#241b24; --ink2:#6b5f68; --ink3:#a093a0; --line:#ece2e9;
            --rose:#bc3c6a; --rose-ink:#8e2a50; --rose-soft:#f9e6ee; --rose-2:#e86a96;
            --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
            --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
            font-family: var(--sans); color: var(--ink);
            background: linear-gradient(160deg, var(--rose-soft), #f5f1f3); }
        .card { background: var(--sf); border: 1px solid var(--line); border-radius: 18px; padding: 34px;
            width: 350px; max-width: 100%; box-shadow: 0 24px 50px -30px rgba(60,20,45,.4); }
        .logo { display: flex; align-items: center; justify-content: center; gap: 10px;
            font-family: var(--serif); font-size: 1.6rem; font-weight: 600; }
        .logo .mark { width: 24px; height: 24px; border-radius: 7px;
            background: radial-gradient(120% 120% at 30% 20%, var(--rose-2), var(--rose-ink)); }
        .sub { text-align: center; color: var(--ink3); font-size: .9rem; margin: 8px 0 22px; }
        .err { background: #fdecec; color: #c0392b; font-size: .85rem; padding: 9px 12px; border-radius: 9px; margin: 0 0 16px; }
        label { display: block; font-size: .8rem; font-weight: 700; color: var(--ink2); margin-bottom: 14px; }
        input { display: block; width: 100%; margin-top: 6px; padding: 10px 12px; font-size: .95rem;
            border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); }
        input:focus { outline: 2px solid var(--rose-soft); border-color: var(--rose); }
        button { width: 100%; margin-top: 6px; padding: 11px; border: none; border-radius: 10px;
            font-family: var(--sans); font-size: .95rem; font-weight: 600; color: #fff; cursor: pointer;
            background: linear-gradient(140deg, var(--rose), var(--rose-ink)); box-shadow: 0 10px 22px -8px var(--rose); }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo"><span class="mark"></span> Glowe</div>
        <p class="sub">Entre na sua conta</p>
        {% if form.errors %}<p class="err">Usuário ou senha inválidos. Tente de novo.</p>{% endif %}
        <form method="post">
            {% csrf_token %}
            <label>Usuário<input name="username" autofocus></label>
            <label>Senha<input type="password" name="password"></label>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
